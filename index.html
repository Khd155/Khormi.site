<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>خرمي</title>
  <meta name="description" content="الموقع الرسمي لعائلة خرمي" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #c9a84c;
      --gold-light: #e8c97a;
      --gold-dim: rgba(201, 168, 76, 0.15);
      --bg: #0d0f14;
      --bg2: #13161e;
      --surface: rgba(255, 255, 255, 0.04);
      --border: rgba(201, 168, 76, 0.2);
      --text: #f0ece0;
      --muted: #8a8070;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Cairo', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Background ── */
    .bg-orbs {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.18;
      animation: drift 18s ease-in-out infinite alternate;
    }
    .orb-1 {
      width: 600px; height: 600px;
      background: var(--gold);
      top: -200px; right: -150px;
      animation-duration: 20s;
    }
    .orb-2 {
      width: 400px; height: 400px;
      background: #4a6fa5;
      bottom: -100px; left: -100px;
      animation-duration: 25s;
      animation-delay: -5s;
    }
    .orb-3 {
      width: 300px; height: 300px;
      background: var(--gold-light);
      top: 50%; left: 40%;
      animation-duration: 15s;
      animation-delay: -10s;
      opacity: 0.08;
    }
    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(40px, 60px) scale(1.1); }
    }

    /* ── Layout ── */
    .wrapper {
      position: relative;
      z-index: 1;
      max-width: 680px;
      margin: 0 auto;
      padding: 0 24px 80px;
    }

    /* ── Header / Hero ── */
    .hero {
      text-align: center;
      padding: 100px 0 60px;
    }

    .logo-ring {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: var(--surface);
      backdrop-filter: blur(12px);
      margin-bottom: 28px;
      position: relative;
      animation: glow-pulse 3s ease-in-out infinite;
    }
    .logo-ring::before {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 1px solid rgba(201, 168, 76, 0.1);
    }
    .logo-ring span {
      font-size: 42px;
      font-weight: 900;
      color: var(--gold);
      letter-spacing: -1px;
    }
    @keyframes glow-pulse {
      0%, 100% { box-shadow: 0 0 20px rgba(201, 168, 76, 0.1); }
      50%       { box-shadow: 0 0 40px rgba(201, 168, 76, 0.25); }
    }

    .hero-name {
      font-size: clamp(40px, 8vw, 64px);
      font-weight: 900;
      letter-spacing: -1px;
      background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 50%, #a87c30 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.1;
      margin-bottom: 12px;
    }

    .hero-sub {
      font-size: 16px;
      color: var(--muted);
      font-weight: 400;
      letter-spacing: 0.5px;
    }

    .divider {
      width: 60px;
      height: 2px;
      background: linear-gradient(to left, transparent, var(--gold), transparent);
      margin: 28px auto;
    }

    /* ── About Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px;
      backdrop-filter: blur(16px);
      margin-bottom: 20px;
      transition: border-color 0.3s, transform 0.3s;
    }
    .card:hover {
      border-color: rgba(201, 168, 76, 0.45);
      transform: translateY(-2px);
    }

    .card-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-label::before {
      content: '';
      display: inline-block;
      width: 16px;
      height: 2px;
      background: var(--gold);
    }

    .card p {
      font-size: 15px;
      line-height: 1.9;
      color: #c8c0a8;
      font-weight: 400;
    }

    /* ── Links Grid ── */
    .links-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 20px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 22px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      text-decoration: none;
      color: var(--text);
      font-family: 'Cairo', sans-serif;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.25s ease;
      cursor: pointer;
      backdrop-filter: blur(16px);
    }
    .link-btn:hover {
      background: var(--gold-dim);
      border-color: var(--gold);
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(201, 168, 76, 0.15);
      color: var(--gold-light);
    }
    .link-btn .icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 18px;
      background: var(--gold-dim);
    }
    .link-btn span { flex: 1; }

    /* Full width link */
    .link-btn.full {
      grid-column: 1 / -1;
    }

    /* ── Quote ── */
    .quote-card {
      background: linear-gradient(135deg, rgba(201,168,76,0.07) 0%, rgba(201,168,76,0.02) 100%);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px;
      text-align: center;
      margin-bottom: 20px;
    }
    .quote-card p {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.7;
    }
    .quote-card .quote-mark {
      font-size: 48px;
      color: var(--gold);
      line-height: 0.5;
      display: block;
      margin-bottom: 16px;
      opacity: 0.6;
    }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding-top: 40px;
      color: var(--muted);
      font-size: 13px;
    }
    footer .dot {
      display: inline-block;
      width: 4px;
      height: 4px;
      background: var(--gold);
      border-radius: 50%;
      margin: 0 8px;
      vertical-align: middle;
    }

    /* ── Fade-in animation ── */
    .fade-up {
      opacity: 0;
      transform: translateY(24px);
      animation: fadeUp 0.7s ease forwards;
    }
    .fade-up:nth-child(1) { animation-delay: 0.1s; }
    .fade-up:nth-child(2) { animation-delay: 0.2s; }
    .fade-up:nth-child(3) { animation-delay: 0.3s; }
    .fade-up:nth-child(4) { animation-delay: 0.4s; }
    .fade-up:nth-child(5) { animation-delay: 0.5s; }
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── Mobile ── */
    @media (max-width: 480px) {
      .links-grid { grid-template-columns: 1fr; }
      .link-btn.full { grid-column: 1; }
      .hero { padding: 70px 0 40px; }
    }
  </style>
</head>
<body>

  <!-- Ambient background -->
  <div class="bg-orbs" aria-hidden="true">

</body>
</html>
